name: Release

# 推送 v* 标签（如 v0.3.1）即自动构建安装包并附到 GitHub Release。
# 也可在 Actions 页面手动 Run workflow 触发。
#
# 开发阶段当前**只构建 Windows**（只出 .exe，NSIS；原因见设计文档 §5.10.1），
# 这样单次构建从三平台并行变成一个 runner，几分钟就能拿到包，方便反复验证。
# 等功能稳定要对外发版时，把下面注释掉的 macos / ubuntu 两行恢复即可。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          # - platform: ubuntu-22.04
          #   args: ''
          # - platform: macos-latest
          #   args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install frontend dependencies
        shell: bash
        # 说明：package-lock.json 若在单一平台生成，只会固化该平台的原生 optional 依赖
        # （esbuild/rollup 的平台二进制，npm bug #4828），导致其它平台构建时找不到原生模块。
        # 因此这里删除 lock，让每个 runner 按自身平台重新解析安装。
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      # 版本漂移自检：Tauri 会拒绝构建 NPM 包与 Rust crate 版本不同步的组合。
      # 因为上面刚删掉 lock 全新安装，这里校验的就是「这次真正会拿去构建的版本」。
      # 单独成一步，是为了让失败原因直接出现在日志里，而不是埋在 tauri build 输出中间。
      - name: Check Tauri package versions
        shell: bash
        run: npm run check:tauri

      # 应用内更新需要签名私钥。但「没配密钥」不该让整个发版挂掉 ——
      # createUpdaterArtifacts 在缺少密钥时会让 Tauri 直接构建失败，
      # 所以检测不到就把它去掉：代价只是这次不发更新清单，安装包照常产出。
      - name: Check updater signing key
        id: signing
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "已配置签名私钥：本次会生成更新包与 latest.json"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=未配置更新签名密钥::仓库 Secret 缺少 TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD，本次不生成更新包（安装包照常产出，但应用内更新不可用）。"
            node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));delete j.bundle.createUpdaterArtifacts;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          fi

      - name: Build app and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 应用内更新的签名。存在时 tauri-action 会一并生成并上传 latest.json，
          # 客户端按 tauri.conf.json 的 plugins.updater.endpoints 去取。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Kore v__VERSION__'
          releaseBody: 'Windows 安装包（.exe，双击安装）。装好后可在应用内「检查更新」自动升级，无云同步。'
          # 直接发布（不建草稿），方便直接点下载链接取包
          releaseDraft: false
          # ⚠️ 必须为 false（正式版），不能是 true（预发布）。
          #
          # GitHub 的 `/releases/latest` **排除所有 prerelease**：
          # 一旦这里为 true，该接口恒定 404，于是**所有**装在旧版本上的
          # 「检查更新」都拿不到版本号（v0.3.6 及更早的客户端用的正是这个接口）。
          # v0.3.7 起客户端已改用 `/releases` 列表接口（能识别 prerelease），
          # 但为了让老客户端也能被发现，发布出去的包必须是正式版。
          prerelease: false
          args: ${{ matrix.args }}
