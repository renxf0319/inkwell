[package]
name = "kore"
version = "0.3.16"
description = "Kore 极速本地 Markdown 编辑器"
authors = ["Kore Contributors"]
edition = "2021"

# 桌面端构建产物不要写入用户的 C 盘仓库；Rust 工具链安装请设置
# CARGO_HOME / RUSTUP_HOME 指向非系统盘（见 README）。
[lib]
name = "kore_lib"
# 桌面端只留 rlib：main.rs 直接链接它即可。
# staticlib / cdylib 仅用于 iOS / Android 嵌入，桌面端不需要。
# 关键：在 -windows-gnu (MinGW) 下，cdylib 会让 rustc 自动导出全部 pub 符号，
# Tauri 依赖树导出 >65535 个，撞上 PE 的 16 位导出序号上限
# （ld: export ordinal too large / rust-lld: too many exported symbols）。
# 去掉 cdylib 后不再生成 DLL 导出表，MinGW 链接即可通过。
# 若日后要出移动端，把这行改回 ["staticlib", "cdylib", "rlib"]。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# 打开外部链接（「检查更新」的下载页）。
# ⚠️ 不能用 window.open：Tauri 的 WebView 不会把它交给系统浏览器，
# 表现就是点了「前往下载」毫无反应。必须走这个插件。
tauri-plugin-opener = "2"
# 应用内自动更新：下载 → 校验签名 → 安装 → 重启。
# ⚠️ 签名校验**无法关闭**，所以必须配好签名私钥（CI 里走 Secret），
# 并把公钥写进 tauri.conf.json 的 plugins.updater.pubkey。
tauri-plugin-updater = "2"
# 更新装完后重启应用（updater 的收尾动作要调 relaunch）
tauri-plugin-process = "2"
# 工作区文件实时监听（磁盘增删改 → 立即通知前端刷新文件树）。
# 走 OS 原生通知（Windows: ReadDirectoryChangesW），是「删除的瞬间就消失」的唯一实现方式；
# 纯前端轮询的下限就是轮询间隔，做不出 Typora 那种实时感。
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
